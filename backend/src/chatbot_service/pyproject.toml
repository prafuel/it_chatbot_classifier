[project]
name = "chatbot-service"
version = "0.1.0"
description = "Chatbot service"
authors = [
    {name = "prafuel",email = "official.sonawaneprafull@gmail.com"}
]
requires-python = "^3.11"
dependencies = [
    "fastapi (==0.115.6)",
    "uvicorn (==0.34.0)",
    "gunicorn (==23.0.0)",
    "pydantic (==2.10.4)",
    "pydantic-settings (==2.7.0)",
    "loguru (==0.7.3)",
    "sentence-transformers (==3.0.0)",
    "faiss-cpu (==1.8.0.post1)",
    "networkx (==3.2.1)",
    "numpy (==1.26.4)",
    "pandas (==2.2.0)",
    "requests (==2.31.0)",
    "beautifulsoup4 (==4.12.3)",
    "lxml (==5.1.1)",
    "trafilatura (==1.9.0)",
    "openai (>=2.30.0,<3.0.0)",
    "langchain-openai (>=1.1.12,<2.0.0)",
    "pyjwt (>=2.12.1,<3.0.0)",
    "sqlalchemy (>=2.0.49,<3.0.0)",
    "sqlalchemy-utils (>=0.42.1,<0.43.0)",
    "tenacity (>=9.1.4,<10.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
